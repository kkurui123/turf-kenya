<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turf Kenya | Football Tournaments, Teams and Players</title>

  <link rel="stylesheet" href="css/home.css" />
</head>

<body>
  <div class="video-background">
    <video
      autoplay
      muted
      loop
      playsinline
    >
      <source
        src="assets/football-background.mp4"
        type="video/mp4"
      />
    </video>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        Turf Kenya
      </a>

      <nav class="main-nav">
        <a href="#teams">Teams</a>
        <a href="#tournaments">Tournaments</a>
        <a href="auth/login.html">Login</a>
        <a href="auth/register.html">Register</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-content">
        <h1>
          Play. Compete. Win.
        </h1>

        <p>
          Turf Kenya helps football teams, players and tournament organisers
          connect, manage tournaments and grow the game.
        </p>

        <div class="hero-actions">
          <a
            href="auth/register.html"
            class="btn btn-light"
          >
            Get started
          </a>

          <a
            href="auth/login.html"
            class="btn btn-outline"
          >
            Login
          </a>

          <button
            type="button"
            id="google-sign-in-button"
            class="btn btn-google"
          >
            Continue with Google
          </button>
        </div>
      </div>
    </section>

    <section
      id="teams"
      class="section"
    >
      <div class="container">
        <h2>
          Featured Teams
        </h2>

        <div
          id="teams-container"
          class="cards-grid"
        >
        </div>
      </div>
    </section>

    <section
      id="tournaments"
      class="section section-alt"
    >
      <div class="container">
        <h2>
          Tournaments
        </h2>

        <div
          id="tournaments-container"
          class="cards-grid"
        >
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        &copy; Turf Kenya. All rights reserved.
      </p>
    </div>
  </footer>

  <script
    type="module"
    src="js/public-home.js"
  ></script>
</body>
</html>
